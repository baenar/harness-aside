# Builds the plugin, runs tests, and runs the IntelliJ Plugin Verifier.
# Triggered on pushes to 'main', manually, and on a pull request only while it is labelled "test ready":
# every time the label is added, and on every push to a PR that already has it. A PR without the label
# runs nothing; each run starts from scratch on the PR's current head and cancels the PR's older run.
#
# Tests run on Linux *and* Windows on purpose: AntigravityHookExecutionTest executes the generated
# hook commands with the shell the CLI uses on that OS (`/bin/sh` or `cmd.exe`), so the Windows leg
# is the only one that catches a hook command cmd can't run.

name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    types: [ labeled, synchronize ]
  workflow_dispatch:

concurrency:
  # Adding any other label also triggers this workflow (and runs nothing), so it gets its own group:
  # it must never cancel a "test ready" run. Re-adding "test ready" or pushing does cancel the older run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'test ready' && '-other-label' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # `build` and `icons` are the roots; `test` and `verify` need `build`, so they skip with it.
  build:
    name: Build
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'test ready') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'test ready'))
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        run: ./gradlew buildPlugin

      # The installable plugin ZIP, downloadable from the workflow run page
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip

  test:
    name: Test (${{ matrix.os }})
    needs: [ build ]
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # `./gradlew` rather than the .bat on both, so the steps stay identical
        shell: bash
    steps:
      - name: Maximize Build Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run Tests
        run: ./gradlew check

      # A skipped test would let the suite report success without covering anything.
      - name: Assert no tests were skipped
        if: ${{ !cancelled() }}
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' build/test-results/test/*.xml \
            | grep -o '[0-9]*' | awk '{ total += $1 } END { print total + 0 }')
          echo "skipped tests: $skipped"
          test "$skipped" -eq 0

      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result-${{ matrix.os }}
          path: ${{ github.workspace }}/build/reports/tests

  icons:
    name: Icons match their generator
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'test ready') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'test ready'))
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Ubuntu ships mawk; the frames were generated with GNU awk and its float formatting
      # has to match byte for byte for the diff below to mean anything.
      - name: Install GNU awk
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gawk

      - name: Regenerate and compare
        run: |
          LC_ALL=C sh tools/generate-icons.sh
          git diff --exit-code -- src/main/resources/icons \
            || { echo "::error::Committed icons differ from tools/generate-icons.sh output — rerun it and commit."; exit 1; }

  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run Plugin Verification tasks
        run: ./gradlew verifyPlugin

      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
