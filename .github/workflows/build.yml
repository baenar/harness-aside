# Builds the plugin, runs tests, and runs the IntelliJ Plugin Verifier.
# Triggered on pushes to 'main', on any pull request, and manually.
#
# Tests run on Linux *and* Windows on purpose: AntigravityHookExecutionTest executes the generated
# hook commands with the shell the CLI uses on that OS (`/bin/sh` or `cmd.exe`), so the Windows leg
# is the only one that catches a hook command cmd can't run.

name: Build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:

  pre_job:
    name: Check for duplicate runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          skip_after_successful_duplicate: 'true'
          concurrent_skipping: 'same_content'
          cancel_others: 'true'

  build:
    name: Build
    needs: [ pre_job ]
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        run: ./gradlew buildPlugin

      # The installable plugin ZIP, downloadable from the workflow run page
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip

  test:
    name: Test (${{ matrix.os }})
    needs: [ pre_job, build ]
    if: needs.pre_job.outputs.should_skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # `./gradlew` rather than the .bat on both, so the steps stay identical
        shell: bash
    steps:
      - name: Maximize Build Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run Tests
        run: ./gradlew check

      # A skipped test would let the suite report success without covering anything.
      - name: Assert no tests were skipped
        if: ${{ !cancelled() }}
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' build/test-results/test/*.xml \
            | grep -o '[0-9]*' | awk '{ total += $1 } END { print total + 0 }')
          echo "skipped tests: $skipped"
          test "$skipped" -eq 0

      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result-${{ matrix.os }}
          path: ${{ github.workspace }}/build/reports/tests

  icons:
    name: Icons match their generator
    needs: [ pre_job ]
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Ubuntu ships mawk; the frames were generated with GNU awk and its float formatting
      # has to match byte for byte for the diff below to mean anything.
      - name: Install GNU awk
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gawk

      - name: Regenerate and compare
        run: |
          LC_ALL=C sh tools/generate-icons.sh
          git diff --exit-code -- src/main/resources/icons \
            || { echo "::error::Committed icons differ from tools/generate-icons.sh output — rerun it and commit."; exit 1; }

  verify:
    name: Verify plugin
    needs: [ pre_job, build ]
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run Plugin Verification tasks
        run: ./gradlew verifyPlugin

      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
